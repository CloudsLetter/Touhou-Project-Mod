name: Release

# 打一个数字开头的 tag（例如 1.3）即自动构建 4 个产物并创建 GitHub Release。
# 手动触发（workflow_dispatch）只跑构建、上传 artifact，不建 Release。
on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  PROJECT_PATH: Touhou Project Mod UI/Touhou Project Mod UI.csproj

jobs:
  publish:
    name: Publish ${{ matrix.asset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lite：单文件，不打包运行时，需要用户自行安装 .NET 8 桌面运行时
          - { rid: win-x86, self_contained: "false", arch: x86,    asset: Touhou.Project.Mod.Lite.x86.exe }
          - { rid: win-x64, self_contained: "false", arch: x86_64, asset: Touhou.Project.Mod.Lite.x86_64.exe }
          # Independence：单文件 + 自包含运行时，开箱即用
          - { rid: win-x86, self_contained: "true",  arch: x86,    asset: Touhou.Project.Mod.Independence.x86.zip }
          - { rid: win-x64, self_contained: "true",  arch: x86_64, asset: Touhou.Project.Mod.Independence.x86_64.zip }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'publish'
          dotnet publish "$env:PROJECT_PATH" -c Release -r ${{ matrix.rid }} `
            -p:SelfContained=${{ matrix.self_contained }} `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            -o "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $out 'Touhou Project Mod UI.exe'
          if (-not (Test-Path $exe)) { throw "publish 没有产出 $exe" }

          $asset = '${{ matrix.asset }}'
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          if ($asset.EndsWith('.zip')) {
            # 自包含版：exe 与 WPF 原生库一起放进同名文件夹再打包
            $folder = "Touhou Project Mod Independence ${{ matrix.arch }}"
            $stage = Join-Path $env:RUNNER_TEMP $folder
            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item (Join-Path $out '*') $stage -Recurse -Force
            Rename-Item (Join-Path $stage 'Touhou Project Mod UI.exe') "Touhou Project Mod UI Independence ${{ matrix.arch }}.exe"
            Compress-Archive -Path $stage -DestinationPath (Join-Path $dist $asset) -CompressionLevel Optimal -Force
          }
          else {
            Copy-Item $exe (Join-Path $dist $asset) -Force
          }

          Get-ChildItem $dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    # 只有 tag 触发的运行才建 Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --latest
          fi
